suite: fulfillment trust admission bootstrap
templates:
  - templates/fulfillment-trust-admission.yaml
tests:
  - it: should render nothing while fulfillment trust is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: should render isolated trust identities and bind sync only after readiness
    set:
      namespace: osac-csi
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: osac-csi
      global.fulfillmentTrust.admission.image.tag: test-version
      global.fulfillmentTrust.clusterOrderUID: order-uid
      global.fulfillmentTrust.tenant: tenant-a
    asserts:
      - hasDocuments:
          count: 22
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: osac-fulfillment-trust-admission
        documentIndex: 0
      - equal:
          path: metadata.name
          value: osac-fulfillment-trust-sync
        documentIndex: 2
      - equal:
          path: metadata.name
          value: osac-fulfillment-trust-observer
        documentIndex: 3
      - equal:
          path: metadata.name
          value: osac-trust-publisher-order-uid
        documentIndex: 4
      - equal:
          path: metadata.annotations["osac.openshift.io/owner-reference"]
          value: order-uid
        documentIndex: 4
      - equal:
          path: metadata.annotations["osac.openshift.io/tenant"]
          value: tenant-a
        documentIndex: 4
      - equal:
          path: rules[0].resources[0]
          value: secrets
        documentIndex: 5
      - equal:
          path: rules[0].resourceNames[0]
          value: osac-fulfillment-trust-expected-bundles
        documentIndex: 5
      - equal:
          path: rules[0].verbs
          value: [get, update]
        documentIndex: 5
      - equal:
          path: rules[0].verbs
          value: [create]
        documentIndex: 7
      - equal:
          path: rules[1].resourceNames[0]
          value: osac-fulfillment-ca
        documentIndex: 7
      - equal:
          path: rules[0].verbs
          value: [get, list, watch]
        documentIndex: 8
      - notExists:
          path: rules[0].verbs[3]
        documentIndex: 8
      - equal:
          path: rules[0].resources[0]
          value: services/proxy
        documentIndex: 9
      - equal:
          path: rules[0].resourceNames[0]
          value: https:osac-fulfillment-trust-admission:https
        documentIndex: 9
      - equal:
          path: rules[0].verbs
          value: [create, delete]
        documentIndex: 9
      - equal:
          path: rules[0].resources[0]
          value: tokenreviews
        documentIndex: 15
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
        documentIndex: 20
      - equal:
          path: webhooks[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: osac-csi
        documentIndex: 19
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "(?s)create secret.*rollout status deployment.*validatingwebhookconfiguration.*expected-bundles.*create rolebinding"
        documentIndex: 20
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "grep -qx 'W10='"
        documentIndex: 20
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-delete
        documentIndex: 21

  - it: should reject a trust namespace that differs from the CSI namespace
    set:
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: another-namespace
    asserts:
      - failedTemplate:
          errorMessage: global.fulfillmentTrust.tenantNamespace must equal the CSI driver namespace when fulfillment trust is enabled

  - it: should require a published admission image tag when trust is enabled
    set:
      namespace: osac-csi
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: osac-csi
    asserts:
      - failedTemplate:
          errorMessage: global.fulfillmentTrust.admission.image.tag must be set to a published osac-operator version when fulfillment trust is enabled

  - it: should require a per-order publisher identity
    set:
      namespace: osac-csi
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: osac-csi
      global.fulfillmentTrust.admission.image.tag: test-version
    asserts:
      - failedTemplate:
          errorMessage: global.fulfillmentTrust.clusterOrderUID is required when fulfillment trust is enabled

  - it: should require a tenant attribution for the publisher identity
    set:
      namespace: osac-csi
      global.fulfillmentTrust.enabled: true
      global.fulfillmentTrust.tenantNamespace: osac-csi
      global.fulfillmentTrust.admission.image.tag: test-version
      global.fulfillmentTrust.clusterOrderUID: order-uid
    asserts:
      - failedTemplate:
          errorMessage: global.fulfillmentTrust.tenant is required when fulfillment trust is enabled
